<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Data Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <div class="text-center mb-8">
                <div class="bg-indigo-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                    📥
                </div>
                <h1 class="text-3xl font-bold text-gray-800 mb-2">Offer Data Exporter</h1>
                <p class="text-gray-600">Download all offers as Excel file</p>
            </div>

            <button onclick="downloadData()" id="downloadBtn" 
                class="w-full py-4 px-6 rounded-lg font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-all">
                📥 Download Excel
            </button>

            <div id="status" class="mt-6 hidden p-4 bg-blue-50 border border-blue-200 rounded-lg">
                <p class="text-sm text-blue-800"></p>
            </div>

            <div id="error" class="mt-6 hidden p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-sm text-red-700"></p>
            </div>

            <div id="success" class="mt-6 hidden p-4 bg-green-50 border border-green-200 rounded-lg">
                <p class="text-sm text-green-700">File downloaded successfully!</p>
            </div>
        </div>
    </div>

    <script>
        async function downloadData() {
            const btn = document.getElementById('downloadBtn');
            const statusDiv = document.getElementById('status');
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');

            btn.disabled = true;
            btn.textContent = '⏳ Processing...';
            btn.classList.add('bg-gray-400', 'cursor-not-allowed');
            btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700');
            
            statusDiv.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            successDiv.classList.add('hidden');

            try {
                const url = 'https://api-ow.pubscale.com/v1/offer/api';
                const headers = {
                    'App-Id': '67460156',
                    'Pub-Key': 'E8A15934E2A4EE8A1621D1431CD4D352',
                    'Content-Type': 'application/json'
                };

                let allOffers = [];
                let page = 1;
                const size = 1000;

                while (true) {
                    statusDiv.querySelector('p').textContent = `Fetching page ${page}...`;
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify({ page, size })
                    });

                    if (!response.ok) throw new Error(`API Error: ${response.status}`);

                    const result = await response.json();
                    const offers = result.data || result.offers || result.results || result;

                    if (!offers || offers.length === 0) break;

                    allOffers = [...allOffers, ...offers];
                    statusDiv.querySelector('p').textContent = 
                        `Retrieved ${offers.length} offers from page ${page}. Total: ${allOffers.length}`;

                    if (offers.length < size) break;
                    page++;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                if (allOffers.length === 0) throw new Error('No data retrieved');

                statusDiv.querySelector('p').textContent = 
                    `Converting ${allOffers.length} offers to Excel...`;

                const headers_row = Object.keys(allOffers[0]);
                let csv = headers_row.join(',') + '\n';

                allOffers.forEach(offer => {
                    const row = headers_row.map(header => {
                        let value = offer[header];
                        if (value === null || value === undefined) return '';
                        if (typeof value === 'object') value = JSON.stringify(value);
                        value = String(value).replace(/"/g, '""');
                        return `"${value}"`;
                    });
                    csv += row.join(',') + '\n';
                });

                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `offers_${new Date().toISOString().split('T')[0]}.csv`;
                link.click();

                statusDiv.classList.add('hidden');
                successDiv.classList.remove('hidden');
            } catch (err) {
                statusDiv.classList.add('hidden');
                errorDiv.classList.remove('hidden');
                errorDiv.querySelector('p').textContent = err.message;
            } finally {
                btn.disabled = false;
                btn.textContent = '📥 Download Excel';
                btn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                btn.classList.add('bg-indigo-600', 'hover:bg-indigo-700');
            }
        }
    </script>
</body>
</html>
